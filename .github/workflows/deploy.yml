# push 到 main 部署 production；手動觸發（任何分支）部署 preview。
# 順序固定：檢查 secrets → 檢查顧客登入與付款設定 → 檢查 Gateway secrets → typecheck / test → Gateway 的 D1 migration 與部署 → App 的 D1 migration → App → Web。
# Gateway 排在 App 前面：它不依賴 App，而 App（#10）上線後會呼叫它；先部署可以保證 App 開始用它時閘道已經在。
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENV: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    # 每個環境同時只跑一個部署；排隊等待，不取消進行中的部署
    concurrency:
      group: deploy-${{ github.event_name == 'push' && 'production' || 'preview' }}
      cancel-in-progress: false
    steps:
      - name: 檢查必要的 secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::缺少 GitHub secret ${name}，請到 Settings > Secrets and variables > Actions 設定後重跑"
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile

      # 顧客登入設定不全或 BETTER_AUTH_URL 填錯、付款設定（GATEWAY_BASE_URL、App 的 GATEWAY_API_KEY、Web 的 GATEWAY_WEBHOOK_SECRET）不全時，
      # 部署出去的登入或付款是壞的；在 migration 之前擋下
      - name: 檢查顧客登入與付款設定（${{ env.DEPLOY_ENV }}）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun apps/app/scripts/check-auth-deploy.ts "${DEPLOY_ENV}"

      # 閘道缺 GATEWAY_API_KEY / GATEWAY_WEBHOOK_SECRET 時所有請求回 503；同樣在 migration 之前擋下
      - name: 檢查 Gateway 的 secrets（${{ env.DEPLOY_ENV }}）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun apps/gateway/scripts/check-gateway-deploy.ts "${DEPLOY_ENV}"

      - run: bun run typecheck
      - run: bun run test

      - name: 套用 Gateway D1 migration（${{ env.DEPLOY_ENV }}）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run "db:migrate:gateway:${DEPLOY_ENV}"
      - name: 部署 Gateway Worker（${{ env.DEPLOY_ENV }}）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run "deploy:gateway:${DEPLOY_ENV}"
      - name: 套用 App D1 migration（${{ env.DEPLOY_ENV }}）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run "db:migrate:${DEPLOY_ENV}"
      - name: 部署 App Worker（${{ env.DEPLOY_ENV }}）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run "deploy:app:${DEPLOY_ENV}"
      - name: 建置並部署 Web Worker（${{ env.DEPLOY_ENV }}）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run "deploy:web:${DEPLOY_ENV}"
